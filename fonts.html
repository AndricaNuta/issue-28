<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick the type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,800;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Figtree:wght@300;400;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Italianno&family=Jost:wght@300;400;500&family=Ms+Madi&family=Parisienne&family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Pinyon+Script&family=Prata&family=Sacramento&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E9E4DB;padding:26px 18px 70px;color:#1C1917}
  .head{font-family:'DM Sans',sans-serif;margin-bottom:22px}
  .head h1{font-size:20px;font-weight:700}
  .head p{font-size:13.5px;opacity:.6;margin-top:3px}
  .grid{display:flex;flex-wrap:wrap;gap:20px}
  .card{width:352px;background:#F1EBE1;border-radius:3px;padding:22px 20px 24px;box-shadow:0 8px 22px rgba(28,25,23,.12)}
  .tag{font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .n{width:22px;height:22px;border-radius:50%;background:#1C1917;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
  .nm{font-size:13px;font-weight:700}
  .fonts{font-family:'DM Sans',sans-serif;font-size:11px;opacity:.55;margin-bottom:18px;line-height:1.4}
  .mast{text-transform:uppercase;line-height:.84;margin-bottom:14px}
  .kick{font-size:10px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;color:#B5342A}
  .ttl{margin-top:6px;line-height:1}
  .sf{margin-top:10px;font-size:14.5px;line-height:1.55;opacity:.72}
  .scr{margin-top:14px;color:#B5342A;line-height:1.05}
  .body{margin-top:14px;font-size:15px;line-height:1.55}
  .body b{color:#B5342A;font-weight:400}
  .rule{height:1px;background:rgba(28,25,23,.16);margin:16px 0}

  /* 1 · current */
  .s1 .mast{font-family:'Playfair Display',serif;font-weight:800;font-size:42px}
  .s1 .kick,.s1 .sf,.s1 .bodyfont{font-family:'DM Sans',sans-serif}
  .s1 .ttl{font-family:'Playfair Display',serif;font-weight:500;font-size:36px}
  .s1 .sf{font-family:'Playfair Display',serif;font-style:italic}
  .s1 .scr{font-family:'Pinyon Script',cursive;font-size:34px}
  .s1 .body{font-family:'DM Sans',sans-serif}
  .s1 .body b{font-family:'Playfair Display',serif}

  /* 2 · Didone + signature */
  .s2 .mast{font-family:'Bodoni Moda',serif;font-weight:800;font-size:40px;letter-spacing:-.01em}
  .s2 .kick{font-family:'Jost',sans-serif}
  .s2 .ttl{font-family:'Bodoni Moda',serif;font-weight:700;font-size:34px}
  .s2 .sf{font-family:'Bodoni Moda',serif;font-style:italic}
  .s2 .scr{font-family:'Ms Madi',cursive;font-size:36px}
  .s2 .body{font-family:'Jost',sans-serif;font-weight:300;font-size:15.5px}
  .s2 .body b{font-family:'Bodoni Moda',serif;font-weight:700}

  /* 3 · warm & characterful */
  .s3 .mast{font-family:'Fraunces',serif;font-weight:700;font-size:40px}
  .s3 .kick{font-family:'Figtree',sans-serif}
  .s3 .ttl{font-family:'Fraunces',serif;font-weight:600;font-size:34px}
  .s3 .sf{font-family:'Fraunces',serif;font-style:italic;font-weight:400}
  .s3 .scr{font-family:'Sacramento',cursive;font-size:38px}
  .s3 .body{font-family:'Figtree',sans-serif;font-weight:300;font-size:15.5px}
  .s3 .body b{font-family:'Fraunces',serif;font-weight:600}

  /* 4 · quiet & expensive */
  .s4 .mast{font-family:'Prata',serif;font-size:36px}
  .s4 .kick{font-family:'Instrument Sans',sans-serif}
  .s4 .ttl{font-family:'Instrument Serif',serif;font-size:40px}
  .s4 .sf{font-family:'Instrument Serif',serif;font-style:italic;font-size:16.5px}
  .s4 .scr{font-family:'Italianno',cursive;font-size:44px}
  .s4 .body{font-family:'Instrument Sans',sans-serif;font-size:15px}
  .s4 .body b{font-family:'Instrument Serif',serif;font-style:italic}

  /* 5 · light & literary */
  .s5 .mast{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:44px;letter-spacing:.02em}
  .s5 .kick{font-family:'DM Sans',sans-serif}
  .s5 .ttl{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px}
  .s5 .sf{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px}
  .s5 .scr{font-family:'Parisienne',cursive;font-size:34px}
  .s5 .body{font-family:'DM Sans',sans-serif;font-weight:400;font-size:15px}
  .s5 .body b{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px}
</style>
</head>
<body>
  <div class="head">
    <h1>Same page, five type systems</h1>
    <p>Tell me a number. Masthead, headline, italic, script and body text in each.</p>
  </div>

  <div class="grid" id="grid"></div>

<script>
const SETS = [
  ['1', 'What it is now', 'Playfair Display · Pinyon Script · DM Sans'],
  ['2', 'Didone &amp; signature', 'Bodoni Moda · Ms Madi · Jost'],
  ['3', 'Warm &amp; characterful', 'Fraunces · Sacramento · Figtree'],
  ['4', 'Quiet &amp; expensive', 'Prata / Instrument Serif · Italianno · Instrument Sans'],
  ['5', 'Light &amp; literary', 'Cormorant Garamond · Parisienne · DM Sans'],
];
document.getElementById('grid').innerHTML = SETS.map(([n, name, fonts]) => `
  <div class="card s${n}">
    <div class="tag"><span class="n">${n}</span><span class="nm">${name}</span></div>
    <div class="fonts">${fonts}</div>
    <div class="mast">Birthday</div>
    <div class="rule"></div>
    <div class="kick">Wellness</div>
    <div class="ttl">The 28-Day Plan</div>
    <div class="sf">We know all you wanted for your birthday this year was to get fit, put your life in order and other Virgo-like wishes.</div>
    <div class="scr">So we completed them for you.</div>
    <div class="rule"></div>
    <div class="body">Just so you know, with or without these completed, <b>you are loved exactly as you are.</b></div>
  </div>`).join('');
</script>
</body>
</html>
